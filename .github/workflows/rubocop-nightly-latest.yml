name: rubocop-nightly-latest

# The 20 most recently published gems on rubygems.org, as a counterweight to
# rubocop-nightly-popular: that one re-reads a fixed set of large, well-formed
# repositories, while this one sees whatever Ruby was actually pushed today.
on:
  schedule:
    # rubocop-nightly-popular starts at 02:17 UTC and runs for at most 6 hours,
    # so this one starts once that window has closed. The two also share a
    # concurrency group, which keeps them apart if that run overruns anyway.
    - cron: '17 9 * * *'
  workflow_dispatch:
    inputs:
      gems_limit:
        description: How many of the most recently published gems to fuzz
        required: false
        default: '20'
      batch_size:
        description: Ruby files per batch
        required: false
        default: '1000'
      time_budget_minutes:
        description: Wall-clock budget for the fuzzer step (in minutes)
        required: false
        default: '345'

permissions:
  contents: read

concurrency:
  group: rubocop-nightly
  cancel-in-progress: false

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    name: rubygems-latest
    env:
      XDG_DATA_HOME: ${{ github.workspace }}/nightly-data
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Install RuboCop master and every extension
        run: bundle exec rake gems:install

      - name: Record the revisions under test
        run: |
          grep -E '^\s+(remote|revision):' "$XDG_DATA_HOME/rubocop-nightly/rubocop-gems/Gemfile.lock" \
            | paste - - | sed 's/remote: //; s/revision: //' | tee revisions.txt

      - name: Fuzz
        id: fuzz
        run: |
          set +e
          timeout --signal=INT "${BUDGET}m" \
            bundle exec bin/rubocop-nightly fuzzer \
              --source rubygems \
              --rubygems-limit "$GEMS_LIMIT" \
              --batch-size "$BATCH_SIZE" \
              --log-level INFO \
            > fuzzer.stdout.log 2> fuzzer.stderr.log
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 fuzzer.stderr.log
          exit 0
        env:
          GEMS_LIMIT: ${{ inputs.gems_limit || '20' }}
          BATCH_SIZE: ${{ inputs.batch_size || '1000' }}
          BUDGET: ${{ inputs.time_budget_minutes || '345' }}

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp fuzzer.stdout.log fuzzer.stderr.log revisions.txt artifacts/ 2>/dev/null || true
          if [ -d "$XDG_DATA_HOME/rubocop-nightly/fuzzer/reproductions" ]; then
            cp -r "$XDG_DATA_HOME/rubocop-nightly/fuzzer/reproductions" artifacts/
          fi
          du -sh artifacts

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rubocop-nightly-latest
          path: artifacts
          retention-days: 30
          if-no-files-found: warn

      - name: Report
        env:
          STATUS: ${{ steps.fuzz.outputs.status }}
        run: |
          case "$STATUS" in
            0)   echo "::notice::No cop errors detected" ;;
            124) echo "::warning::Time budget exhausted before the corpus was finished" ;;
            *)   echo "::error::Fuzzer exited $STATUS - see the rubocop-nightly-latest artifact"
                 grep -F 'reproductions' fuzzer.stderr.log | sed 's/^/  /' || true
                 exit 1 ;;
          esac
