name: zizmor

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    name: workflow audit
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor==1.30.0

      - name: Audit the workflows
        run: zizmor --format plain .github/workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
